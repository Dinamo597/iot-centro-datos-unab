[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# --- Lab 5 (sala-01): se conserva intacto, medición "ambiente" ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["unab/sala1/telemetry"]
  data_format = "json"
  name_override = "ambiente"

# --- Parcial 2: el mismo sensor sala-01 también va a la medición "dc" ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["unab/sala1/telemetry"]
  data_format = "json"
  name_override = "dc"
  [inputs.mqtt_consumer.tags]
    device = "sala-01"
    origin = "Digital Twin"

# --- Parcial 2: telemetría de la flota ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["unab/dc/+/telemetry"]
  data_format = "json"
  tag_keys = ["origin"]
  name_override = "dc"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "unab/dc/+/telemetry"
    tags = "_/_/device/_"

# --- Parcial 2: estado reportado de cada dispositivo (retroceso) ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["unab/dc/+/state"]
  data_format = "json"
  tag_keys = ["origin"]
  name_override = "dc_state"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "unab/dc/+/state"
    tags = "_/_/device/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
